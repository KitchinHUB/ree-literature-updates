# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: e823d276-fe4c-4fdf-808c-85a2440eab03
  title: Rare Earth Element Separations
  description: >-
    An organized introduction to rare earth element separation science for new
    researchers, followed by dedicated treatments of the group's areas of
    interest.
  keywords:
    - rare earth elements
    - separations
    - solvent extraction
    - hydrometallurgy
  authors:
    - name: John Kitchin
      email: jkitchin@andrew.cmu.edu
      affiliations:
        - Carnegie Mellon University
  github: https://github.com/KitchinHUB/ree-literature-updates
  license: CC-BY-4.0
  bibliography:
    - references.bib
  exports:
    # LaTeX only. The PDF is produced by tools/build_pdf.py, which patches
    # the generated TeX before running LuaLaTeX -- see that file for why.
    - format: tex
      template: plain_latex_book
      output: _build/tex/rare-earth-separations.tex
  # Puts a download link in the toolbar of every page. The file is built by
  # tools/build_pdf.py, which the deploy workflow runs BEFORE the HTML build --
  # that order matters, because MyST warns and drops the link if the file is
  # missing at build time (it does not fail the build, so the loss is silent).
  #
  # This leaves two copies of the PDF in the site, and that is deliberate. MyST
  # serves this one from a content-hashed path, which is what makes it resolve
  # correctly under BASE_URL. The workflow separately copies the same file to
  # /rare-earth-separations.pdf, which is the stable citable URL src/00-preface.md
  # links to and which must not move. 3.4 MB of a 60 MB site buys both.
  downloads:
    - file: exports/rare-earth-separations.pdf
      title: Download the book (PDF)
  toc:
    - file: src/00-title.md
    - file: src/00-prologue.md
    - file: src/00-preface.md

    - title: Part I — Orientation
      children:
        - file: src/01-why-separation-is-hard.md
        - file: src/02-ore-to-feed-solution.md
        - file: src/03-solvent-extraction-fundamentals.md
        - file: src/04-technology-landscape.md

    - title: "Part II — Upstream: Ore to Purified Feed"
      children:
        - file: src/05-hydrometallurgical-leaching.md
        - file: src/06-ion-adsorption-clays.md
        - file: src/07-pyrometallurgical-halogenation.md

    - title: Part III — Separation Technologies
      children:
        - file: src/08-coacervates.md
        - file: src/09-microfluidic-separations.md
        - file: src/10-selective-crystallization.md
        - file: src/11-biological-biomimetic.md
        - file: src/12-electrochemical-separations.md
        - file: src/13-membranes-mofs-emerging.md

    - title: Part IV — Methods
      children:
        - file: src/14-extraction-thermodynamics.md
        - file: src/15-kinetics-and-mass-transfer.md
        - file: src/16-high-throughput-computational.md
        - file: src/17-process-modeling-optimization.md
        - file: src/18-machine-learning.md
        - file: src/19-characterization.md

    - title: Part V — Context
      children:
        - file: src/20-recycling-urban-mining.md
        - file: src/21-produced-water-critical-minerals.md
        - file: src/22-uranium-and-plutonium.md
        - file: src/23-environment-tea-lca.md
        - file: src/24-industrial-landscape.md
        - file: src/25-research-directions.md

    - title: Back Matter
      children:
        - file: src/90-glossary.md
        - file: src/91-index.md
        - file: src/95-explore.md
        - file: src/92-references.md
        - file: src/93-appendix-provenance.md
        - file: src/94-appendix-further-reading.md

site:
  template: book-theme
  options:
    folders: true
    # Draft watermark on every page. Delete this line to remove it.
    style: ./static/draft.css
