# Build the MyST book in ree-book/ and publish it to GitHub Pages.
#
# The site is served from a repository subpath
# (https://kitchinhub.github.io/ree-literature-updates/), so BASE_URL must be
# set at build time or every CSS, JS, and internal link in the output resolves
# against the domain root and 404s. See
# https://mystmd.org/guide/deployment-github-pages
name: Deploy book

on:
  push:
    branches: [main]
    paths:
      - 'ree-book/**'
      - '.github/workflows/deploy-book.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # LuaLaTeX, not pdflatex: the book needs fontspec for the box-drawing
      # glyphs in its verbatim blocks. fonts-dejavu-core supplies the mono
      # face, texlive-latex-extra supplies draftwatermark and imakeidx, and
      # librsvg2-bin renders the SVG figures to PDF.
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended latexmk fonts-dejavu-core librsvg2-bin

      - name: Build the PDF
        working-directory: ree-book
        run: python3 tools/build_pdf.py

      - name: Build the book
        working-directory: ree-book
        run: npx -y mystmd build --html

      # The ask-the-book widget: chunk the built AST, embed the passages into a
      # static index, and inject the widget into every page. Everything runs at
      # build time; the site stays a static site and calls no API at runtime.
      - name: Install index-builder dependencies
        working-directory: ree-book
        run: npm ci

      - name: Build the retrieval index and inject the widget
        working-directory: ree-book
        run: bash tools/build_chat.sh

      # Served at <site>/rare-earth-separations.pdf, which is the URL the
      # preface links to.
      - name: Add the PDF to the site
        working-directory: ree-book
        run: cp exports/rare-earth-separations.pdf _build/html/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ree-book/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
